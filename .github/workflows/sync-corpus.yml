name: Synchroniser les corpus Eval
on:
  push:
    paths:
      - '.github/workflows/sync-corpus.yml'
      - 'scripts/sync.py'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extraire et valider les corpus
        run: python scripts/sync.py
      - name: Publier les modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Synchroniser les corpus sources"
            git push
          fi
