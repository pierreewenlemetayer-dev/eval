name: Tester le parcours dans Chromium
on:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'data/**'
      - 'tests/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: npm install --no-audit --no-fund
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Tester les parcours réels
        run: npm run test:browser
      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
